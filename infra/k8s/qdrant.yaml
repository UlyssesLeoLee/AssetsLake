# ```cypher
# CREATE
#   (f:File {name: "qdrant.yaml", type: "file", language: "yaml"}),
#   (m:Module {name: "infra.k8s.qdrant", type: "module"}),
#   (c1:Class {name: "assetslake-qdrant", type: "StatefulSet", language: "yaml"}),
#   (c2:Class {name: "assetslake-qdrant", type: "Service", language: "yaml"}),
#   (v1:Variable {name: "qdrant-data", type: "PersistentVolumeClaim"}),
#   (f)-[:CONTAINS]->(m),
#   (m)-[:CONTAINS]->(c1),
#   (m)-[:CONTAINS]->(c2),
#   (c1)-[:USES]->(v1),
#   (c2)-[:ROUTES_TO]->(c1);
# ```

apiVersion: v1
kind: Service
metadata:
  name: assetslake-qdrant
  labels:
    app.kubernetes.io/component: qdrant
spec:
  selector:
    app: assetslake-qdrant
  ports:
    - name: http
      port: 6333
      targetPort: 6333
    - name: grpc
      port: 6334
      targetPort: 6334
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: assetslake-qdrant
  labels:
    app.kubernetes.io/component: qdrant
spec:
  serviceName: assetslake-qdrant
  replicas: 1
  selector:
    matchLabels:
      app: assetslake-qdrant
  template:
    metadata:
      labels:
        app: assetslake-qdrant
        app.kubernetes.io/component: qdrant
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 6333
            - name: grpc
              containerPort: 6334
          readinessProbe:
            httpGet:
              path: /readyz
              port: 6333
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 6333
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: qdrant-data
              mountPath: /qdrant/storage
  volumeClaimTemplates:
    - metadata:
        name: qdrant-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
