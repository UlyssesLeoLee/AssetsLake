apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: assetslake-postgres-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: assetslake-postgres
  labels:
    app.kubernetes.io/component: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: assetslake-postgres
  template:
    metadata:
      labels:
        app: assetslake-postgres
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: assetslake-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: assetslake-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: assetslake-secrets
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - assetslake
                - -d
                - assetslake
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: migrations
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: assetslake-postgres-data
        - name: migrations
          configMap:
            name: assetslake-db-migrations
---
apiVersion: v1
kind: Service
metadata:
  name: assetslake-postgres
  labels:
    app.kubernetes.io/component: postgres
spec:
  selector:
    app: assetslake-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
