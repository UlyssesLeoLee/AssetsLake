apiVersion: apps/v1
kind: Deployment
metadata:
  name: assetslake-asset-frontend
  labels:
    app.kubernetes.io/component: asset-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: assetslake-asset-frontend
  template:
    metadata:
      labels:
        app: assetslake-asset-frontend
        app.kubernetes.io/component: asset-frontend
    spec:
      containers:
        - name: frontend
          image: assetslake-frontend-asset:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: assetslake-config
          env:
            - name: NEXT_PUBLIC_APP_ID
              value: asset-console
---
apiVersion: v1
kind: Service
metadata:
  name: assetslake-asset-frontend
  labels:
    app.kubernetes.io/component: asset-frontend
spec:
  selector:
    app: assetslake-asset-frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
