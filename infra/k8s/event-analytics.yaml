apiVersion: v1
kind: ConfigMap
metadata:
  name: assetslake-clickhouse-init
data:
  001_domain_events.sql: |
    CREATE DATABASE IF NOT EXISTS assetslake_events;

    CREATE TABLE IF NOT EXISTS assetslake_events.raw_domain_events (
      event_id UUID,
      topic LowCardinality(String),
      event_type LowCardinality(String),
      schema_version UInt16,
      producer LowCardinality(String),
      aggregate_type LowCardinality(String),
      aggregate_id UUID,
      workspace_id Nullable(UUID),
      occurred_at DateTime64(3, 'UTC'),
      trace_id UUID,
      causation_id Nullable(UUID),
      payload String,
      ingested_at DateTime DEFAULT now()
    )
    ENGINE = MergeTree
    PARTITION BY toYYYYMM(occurred_at)
    ORDER BY (topic, event_type, aggregate_id, occurred_at, event_id);

    CREATE TABLE IF NOT EXISTS assetslake_events.asset_fact (
      asset_id UUID,
      project_id Nullable(UUID),
      name String,
      status LowCardinality(String),
      version UInt32,
      event_type LowCardinality(String),
      occurred_at DateTime64(3, 'UTC'),
      projection_updated_at DateTime DEFAULT now()
    )
    ENGINE = ReplacingMergeTree(projection_updated_at)
    ORDER BY asset_id;

    CREATE MATERIALIZED VIEW IF NOT EXISTS assetslake_events.mv_asset_fact
    TO assetslake_events.asset_fact
    AS
    SELECT
      toUUIDOrZero(JSONExtractString(payload, 'asset_id')) AS asset_id,
      nullIf(toUUIDOrZero(JSONExtractString(payload, 'project_id')), toUUID('00000000-0000-0000-0000-000000000000')) AS project_id,
      JSONExtractString(payload, 'name') AS name,
      JSONExtractString(payload, 'status') AS status,
      toUInt32OrZero(JSONExtractRaw(payload, 'version')) AS version,
      event_type,
      occurred_at,
      now() AS projection_updated_at
    FROM assetslake_events.raw_domain_events
    WHERE topic = 'assets.asset.v1';

    CREATE TABLE IF NOT EXISTS assetslake_events.issue_flow_fact (
      issue_id UUID,
      project_id Nullable(UUID),
      issue_key String,
      title String,
      status LowCardinality(String),
      event_type LowCardinality(String),
      occurred_at DateTime64(3, 'UTC'),
      projection_updated_at DateTime DEFAULT now()
    )
    ENGINE = ReplacingMergeTree(projection_updated_at)
    ORDER BY issue_id;

    CREATE MATERIALIZED VIEW IF NOT EXISTS assetslake_events.mv_issue_flow_fact
    TO assetslake_events.issue_flow_fact
    AS
    SELECT
      toUUIDOrZero(JSONExtractString(payload, 'issue_id')) AS issue_id,
      nullIf(toUUIDOrZero(JSONExtractString(payload, 'project_id')), toUUID('00000000-0000-0000-0000-000000000000')) AS project_id,
      JSONExtractString(payload, 'issue_key') AS issue_key,
      JSONExtractString(payload, 'title') AS title,
      coalesce(JSONExtractString(payload, 'status'), JSONExtractString(payload, 'to_status')) AS status,
      event_type,
      occurred_at,
      now() AS projection_updated_at
    FROM assetslake_events.raw_domain_events
    WHERE topic = 'production.issue.v1';
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: assetslake-clickhouse-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 30Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: assetslake-clickhouse
  labels:
    app.kubernetes.io/component: clickhouse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: assetslake-clickhouse
  template:
    metadata:
      labels:
        app: assetslake-clickhouse
        app.kubernetes.io/component: clickhouse
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24.8
          ports:
            - containerPort: 8123
            - containerPort: 9000
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: assetslake-clickhouse-data
        - name: init
          configMap:
            name: assetslake-clickhouse-init
---
apiVersion: v1
kind: Service
metadata:
  name: assetslake-clickhouse
  labels:
    app.kubernetes.io/component: clickhouse
spec:
  selector:
    app: assetslake-clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: 8123
    - name: native
      port: 9000
      targetPort: 9000
