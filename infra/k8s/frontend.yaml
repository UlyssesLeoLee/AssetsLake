apiVersion: apps/v1
kind: Deployment
metadata:
  name: assetslake-frontend
  labels:
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: assetslake-frontend
  template:
    metadata:
      labels:
        app: assetslake-frontend
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: assetslake-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: assetslake-config
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: assetslake-frontend
  labels:
    app.kubernetes.io/component: frontend
spec:
  selector:
    app: assetslake-frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
