apiVersion: batch/v1
kind: Job
metadata:
  name: assetslake-domain-db-migrations
  labels:
    app.kubernetes.io/component: domain-db-migrations
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: assetslake-domain-db-migrations
        app.kubernetes.io/component: domain-db-migrations
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: postgres:16-alpine
          env:
            - name: IDENTITY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: assetslake-secrets
                  key: IDENTITY_DATABASE_URL
            - name: PROJECTS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: assetslake-secrets
                  key: PROJECTS_DATABASE_URL
            - name: ASSETS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: assetslake-secrets
                  key: ASSETS_DATABASE_URL
            - name: PRODUCTION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: assetslake-secrets
                  key: PRODUCTION_DATABASE_URL
            - name: PLANNING_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: assetslake-secrets
                  key: PLANNING_DATABASE_URL
            - name: WORKFLOW_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: assetslake-secrets
                  key: WORKFLOW_DATABASE_URL
            - name: REPORTING_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: assetslake-secrets
                  key: REPORTING_DATABASE_URL
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              urls="$IDENTITY_DATABASE_URL $PROJECTS_DATABASE_URL $ASSETS_DATABASE_URL $PRODUCTION_DATABASE_URL $PLANNING_DATABASE_URL $WORKFLOW_DATABASE_URL $REPORTING_DATABASE_URL"
              for url in $urls; do
                until psql "$url" -v ON_ERROR_STOP=1 -c "SELECT 1"; do
                  echo "Waiting for $url"
                  sleep 3
                done
                for file in /migrations/*.sql; do
                  echo "Applying $file"
                  psql "$url" -v ON_ERROR_STOP=1 -f "$file"
                done
              done
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
      volumes:
        - name: migrations
          configMap:
            name: assetslake-db-migrations
