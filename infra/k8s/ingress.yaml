apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: assetslake
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
spec:
  rules:
    - host: assetslake.local
      http:
        paths:
          - path: /api/assets
            pathType: Prefix
            backend:
              service:
                name: assetslake-assets-api
                port:
                  number: 8080
          - path: /api/projects
            pathType: Prefix
            backend:
              service:
                name: assetslake-projects-api
                port:
                  number: 8080
          - path: /api/issues
            pathType: Prefix
            backend:
              service:
                name: assetslake-production-api
                port:
                  number: 8080
          - path: /api/project-management/reports
            pathType: Prefix
            backend:
              service:
                name: assetslake-reporting-api
                port:
                  number: 8080
          - path: /api/project-management/workflow
            pathType: Prefix
            backend:
              service:
                name: assetslake-workflow-api
                port:
                  number: 8080
          - path: /api/project-management/automation
            pathType: Prefix
            backend:
              service:
                name: assetslake-workflow-api
                port:
                  number: 8080
          - path: /api/project-management/enterprise
            pathType: Prefix
            backend:
              service:
                name: assetslake-workflow-api
                port:
                  number: 8080
          - path: /api/project-management
            pathType: Prefix
            backend:
              service:
                name: assetslake-planning-api
                port:
                  number: 8080
          - path: /api/management
            pathType: Prefix
            backend:
              service:
                name: assetslake-reporting-api
                port:
                  number: 8080
          - path: /api/data-lake
            pathType: Prefix
            backend:
              service:
                name: assetslake-reporting-api
                port:
                  number: 8080
          - path: /api/milestones
            pathType: Prefix
            backend:
              service:
                name: assetslake-production-api
                port:
                  number: 8080
          - path: /api/delivery-packages
            pathType: Prefix
            backend:
              service:
                name: assetslake-production-api
                port:
                  number: 8080
          - path: /api/verification
            pathType: Prefix
            backend:
              service:
                name: assetslake-verification-email
                port:
                  number: 8080
          - path: /api/health
            pathType: Prefix
            backend:
              service:
                name: assetslake-assets-api
                port:
                  number: 8080
          - path: /kiali
            pathType: Prefix
            backend:
              service:
                name: assetslake-kiali
                port:
                  number: 20001
          - path: /app/assets
            pathType: Prefix
            backend:
              service:
                name: assetslake-asset-frontend
                port:
                  number: 3000
          - path: /app/production
            pathType: Prefix
            backend:
              service:
                name: assetslake-production-frontend
                port:
                  number: 3000
          - path: /app/planning
            pathType: Prefix
            backend:
              service:
                name: assetslake-planning-frontend
                port:
                  number: 3000
          - path: /app/workflow
            pathType: Prefix
            backend:
              service:
                name: assetslake-workflow-frontend
                port:
                  number: 3000
          - path: /app/identity
            pathType: Prefix
            backend:
              service:
                name: assetslake-identity-frontend
                port:
                  number: 3000
          - path: /app/reports
            pathType: Prefix
            backend:
              service:
                name: assetslake-reporting-frontend
                port:
                  number: 3000
          - path: /app/observability
            pathType: Prefix
            backend:
              service:
                name: assetslake-observability-frontend
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: assetslake-frontend
                port:
                  number: 3000
    - host: minio.assetslake.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: assetslake-minio
                port:
                  number: 9000
    - host: minio-console.assetslake.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: assetslake-minio
                port:
                  number: 9001
