apiVersion: v1
kind: ConfigMap
metadata:
  name: assetslake-config
data:
  POSTGRES_DB: assetslake
  POSTGRES_USER: assetslake
  MINIO_BUCKET: art-assets
  MINIO_ENDPOINT: http://assetslake-minio:9000
  MINIO_PUBLIC_ENDPOINT: http://minio.assetslake.local
  RAG_MEMORY_ENABLED: "true"
  QDRANT_URL: http://assetslake-qdrant:6333
  QDRANT_VECTOR_SIZE: "384"
  QDRANT_REPLICATION_FACTOR: "1"
  PEOPLE_EVENT_CONSUMER_ENABLED: "true"
  PEOPLE_EVENT_CONSUMER_INTERVAL_SECONDS: "15"
  PEOPLE_RECONCILE_INTERVAL_SECONDS: "86400"
  MAX_UPLOAD_SIZE_MB: "500"
  ASSET_SIGNED_URLS_ENABLED: "true"
  ASSET_SIGNED_URL_TTL_SECONDS: "300"
  ASSET_READ_AUTH_REQUIRED: "true"
  ASSET_ACCESS_AUDIT_ENABLED: "true"
  MAX_ASSET_FILENAME_BYTES: "180"
  ASSET_BLOCKED_EXTENSIONS: exe,dll,com,scr,msi,dmg,app,deb,rpm,apk,ipa,jar,war,ear,svg
  ASSET_BLOCKED_MIME_TYPES: application/x-msdownload,application/x-dosexec,application/x-msi,image/svg+xml,text/html,application/xhtml+xml
  RUST_LOG: info
  SERVER_HOST: 0.0.0.0
  SERVER_PORT: "8080"
  SERVER_WORKERS: "0"
  DB_MAX_CONNECTIONS: "8"
  DB_MIN_CONNECTIONS: "1"
  DB_ACQUIRE_TIMEOUT_SECONDS: "2"
  DB_STATEMENT_TIMEOUT_MS: "2500"
  DB_LOCK_TIMEOUT_MS: "2000"
  DB_POOL_MODE: transaction
  PGBOUNCER_DEFAULT_POOL_SIZE: "100"
  PGBOUNCER_RESERVE_POOL_SIZE: "25"
  PGBOUNCER_MAX_CLIENT_CONN: "150000"
  API_LATENCY_SLO_MS: "3000"
  RESOURCE_LOCK_STRICT_WRITES: "false"
  SESSION_TOUCH_INTERVAL_SECONDS: "60"
  RATE_LIMIT_LOGIN_MAX: "30"
  RATE_LIMIT_LOGIN_WINDOW_SECONDS: "60"
  RATE_LIMIT_VERIFICATION_MAX: "10"
  RATE_LIMIT_VERIFICATION_WINDOW_SECONDS: "300"
  BACKEND_MAINTENANCE_ENABLED: "true"
  BACKEND_MAINTENANCE_INTERVAL_SECONDS: "300"
  SESSION_RETENTION_HOURS: "168"
  RELEASED_LOCK_RETENTION_HOURS: "24"
  VERIFICATION_OUTBOX_RETENTION_HOURS: "72"
  EVENT_PIPELINE_ENABLED: "true"
  OUTBOX_RELAY_ENABLED: "true"
  EVENT_RELAY_DRY_RUN: "false"
  OUTBOX_RELAY_INTERVAL_SECONDS: "2"
  OUTBOX_RELAY_BATCH_SIZE: "500"
  KAFKA_BROKERS: assetslake-events-kafka-bootstrap:9092
  CLICKHOUSE_URL: http://assetslake-clickhouse:8123
  OTEL_TRACES_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://assetslake-skywalking-oap:11800
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_EXPORTER_OTLP_TIMEOUT_SECONDS: "3"
  OTEL_RESOURCE_ATTRIBUTES: service.namespace=assetslake,deployment.environment.name=kubernetes
  AI_PROVIDER_TIMEOUT_SECONDS: "18"
  AI_PROVIDER_CHAT_COOLDOWN_SECONDS: "120"
  ASSETS_INTERNAL_URL: http://assetslake-assets-api:8080
  VERIFICATION_APP_KEY: assetslake
  VERIFICATION_OWNER_EMAIL: hanakagumi@outlook.com
  VERIFICATION_EMAIL_FROM: hanakagumi@outlook.com
  VERIFICATION_SMS_SENDER: AssetsLake
  VERIFICATION_CODE_DIGITS: "6"
  VERIFICATION_CODE_TTL_SECONDS: "300"
  VERIFICATION_DEV_CODE_VISIBLE: "false"
  VERIFICATION_EMAIL_PROVIDER: gmail
  VERIFICATION_SMS_PROVIDER: local
  GMAIL_SMTP_HOST: smtp.gmail.com
  GMAIL_SMTP_PORT: "587"
  GMAIL_SMTP_FROM_EMAIL: lidian727@gmail.com
  GMAIL_SMTP_FROM_NAME: AssetsLake
  OUTLOOK_SMTP_HOST: smtp-mail.outlook.com
  OUTLOOK_SMTP_PORT: "587"
  OUTLOOK_SMTP_FROM_EMAIL: hanakagumi@outlook.com
  OUTLOOK_SMTP_FROM_NAME: AssetsLake
  SMTP_HOST: smtp-mail.outlook.com
  SMTP_PORT: "587"
  SMTP_FROM_EMAIL: hanakagumi@outlook.com
  SMTP_FROM_NAME: AssetsLake
  NEXT_PUBLIC_API_URL: /
  NEXT_PUBLIC_APP_ID: studio-console
  NEXT_PUBLIC_MINIO_PUBLIC_ENDPOINT: http://minio.assetslake.local
  NEXT_PUBLIC_MINIO_BUCKET: art-assets
  KIALI_CONSOLE_URL: /kiali/console/graph/namespaces?namespaces=assetslake&graphType=service&duration=300&refresh=15000
  KIALI_PROXY_URL: http://assetslake-kiali:20001
  SKYWALKING_UI_URL: http://observability.assetslake.local/dashboard/GENERAL/All/General-Root
