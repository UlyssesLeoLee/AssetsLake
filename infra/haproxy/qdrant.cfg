global
  log stdout format raw local0
  maxconn 256

defaults
  log global
  mode http
  option httplog
  timeout connect 2s
  timeout client 30s
  timeout server 30s

frontend qdrant_http
  bind *:6333
  default_backend qdrant_nodes

backend qdrant_nodes
  option httpchk GET /healthz
  http-check expect status 200
  balance roundrobin
  server qdrant qdrant:6333 check
  server qdrant-replica qdrant-replica:6333 check backup
